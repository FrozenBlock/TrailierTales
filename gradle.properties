
# Increases the amount of memory Gradle can use and optimizes the GC
# -XX:+UseZGC
org.gradle.jvmargs=-Xmx4G
# Helps with build times
org.gradle.parallel=true
# Caches Dependencies for faster build times.
org.gradle.caching=true

# Fabric Properties
# Get new versions at https://fabricmc.net/develop
minecraft_version=26.2
fabric_loader_version=0.19.3
min_fabric_loader_version=0.19.0

# Mod Properties
mod_id = trailiertales
mod_name = Trailier Tales
mod_version = 1.2.8
# protocol version must be changed after each update with dual env changes
protocol_version = 3
maven_group = net.frozenblock
archives_base_name = TrailierTales
repository = FrozenBlock/TrailierTales

# Publishing
release_type = release
modrinth_project_id = 9xTQM0ci
curseforge_project_id = 1124703

# Dependencies
fabric_api_version=0.158.0+26.2
frozenlib_version=2.5.2-mc26.2
wilderwild_version=4.2.11-mc26.2

# External Mods
modmenu_version=18.0.0-alpha.8
cloth_config_version=26.1.154
lithium_version=mc26.2-0.25.0

# NeoForge Properties (verify versions against the snapshot maven)
neoforge_version=26.2.0.72
neoforge_loader_version_range=[4,)

# Optional: set to a PR/snapshot NeoForge maven URL, or leave blank to skip
neoforge_snapshot_maven=
